name: 中国移动自动签到

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 运行签到脚本
        env:
          CMCC_PHONE: ${{ secrets.CMCC_PHONE }}
          CMCC_APP_TOKEN: ${{ secrets.CMCC_CONFIG }}
          CMCC_CONFIG: ${{ secrets.CMCC_CONFIG }}
        run: |
          python cmcc_sign.py
